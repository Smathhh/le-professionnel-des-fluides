<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E3F"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fluidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#shieldGrad)" filter="url(#glow)"/>
  <rect x="34" y="34" width="444" height="444" rx="110" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

  <!-- Industrial Gear / Fluid Ring -->
  <g transform="translate(256,256) scale(1.15)" stroke="#60A5FA" stroke-width="6" stroke-opacity="0.25" fill="none">
    <circle r="96"/>
    <circle r="60"/>
    <line x1="-120" y1="0" x2="120" y2="0"/>
    <line x1="0" y1="-120" x2="0" y2="120"/>
  </g>

  <!-- Stylized Pure Fluid Wave & Droplet -->
  <path d="M256 110 C256 110 160 230 160 300 C160 360 203 400 256 400 C309 400 352 360 352 300 C352 230 256 110 256 110 Z" fill="#FFFFFF"/>
  <path d="M256 170 C256 170 196 256 196 306 C196 345 224 372 256 372 C288 372 316 345 316 306 C316 256 256 170 256 170 Z" fill="url(#fluidGrad)"/>
</svg>
