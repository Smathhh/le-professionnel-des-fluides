<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none">
  <defs>
    <linearGradient id="logoShieldW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="logoBoltW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="textGradW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#logoShieldW)"/>
    <rect x="1" y="1" width="78" height="78" rx="21" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

    <!-- Fluid Wave / Droplet Glyph -->
    <path d="M40 18 C40 18 24 38 24 50 C24 60 31 66 40 66 C49 66 56 60 56 50 C56 38 40 18 40 18 Z" fill="#FFFFFF"/>
    <path d="M40 28 C40 28 30 42 30 50 C30 56 35 60 40 60 C45 60 50 56 50 50 C50 42 40 28 40 28 Z" fill="url(#logoBoltW)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(106, 20)">
    <text x="0" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="1" fill="#FFFFFF">
      LE PROFESSIONNEL
    </text>
    <text x="0" y="53" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="0.5" fill="url(#textGradW)">
      DES FLUIDES
    </text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="70" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="2" fill="#94A3B8">
      PLOMBERIE • CLIMATISATION • SOLUTIONS FLUIDES
    </text>
  </g>
</svg>
